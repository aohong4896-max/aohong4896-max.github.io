<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>妙手神偷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #14121c; color: #cfc8e0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: "Noto Sans SC", sans-serif; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; display: block;
          max-width: 100vw; max-height: calc(100vh - 40px); aspect-ratio: 960 / 672;
          border: 3px solid #3a3450; box-shadow: 0 0 0 3px #0a0910, 0 12px 40px #000; }
  body.touch { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overflow: hidden; }
  body.touch #help { display: none; }
  body.touch #game { max-height: 100dvh; max-height: 100vh; }
  @media (orientation: portrait) { body.touch { justify-content: flex-start; padding-top: 12px; box-sizing: border-box; } }
  #touch { display: none; }
  body.touch #touch { display: block; }
  .tc { position: fixed; z-index: 10; touch-action: none; -webkit-tap-highlight-color: transparent;
        font-family: "Noto Sans SC", sans-serif; color: #fff; text-align: center; user-select: none; }
  #dpad { left: calc(10px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom));
          width: 120px; height: 120px; border-radius: 50%; background: rgba(30,26,50,.55); border: 3px solid rgba(255,255,255,.25); }
  #dpad span { position: absolute; width: 0; height: 0; border: 14px solid transparent; opacity: .75; }
  #dpad .u { left: calc(50% - 14px); top: 7px; border-bottom: 18px solid #fff; border-top: 0; }
  #dpad .d { left: calc(50% - 14px); bottom: 7px; border-top: 18px solid #fff; border-bottom: 0; }
  #dpad .l { top: calc(50% - 14px); left: 7px; border-right: 18px solid #fff; border-left: 0; }
  #dpad .r { top: calc(50% - 14px); right: 7px; border-left: 18px solid #fff; border-right: 0; }
  #dpad span.on { opacity: 1; filter: drop-shadow(0 0 4px #ffe060); }
  .tb { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px;
        border: 3px solid rgba(255,255,255,.35); box-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .tb.down { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
  #bAct { right: calc(14px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 84px; height: 84px; background: rgba(200,60,70,.8); }
  #bSneak { right: calc(24px + env(safe-area-inset-right)); bottom: calc(116px + env(safe-area-inset-bottom)); width: 64px; height: 64px; background: rgba(70,60,140,.8); font-size: 15px; }
  #bSneak.on { background: rgba(150,90,230,.95); border-color: #ffe060; }
  #bHelp { right: calc(14px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); width: 40px; height: 40px; background: rgba(30,26,50,.7); font-size: 18px; }
  @media (orientation: portrait) {
    #bSneak { right: calc(112px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); }
    #bAct { bottom: calc(40px + env(safe-area-inset-bottom)); }
    #bHelp { top: auto; bottom: calc(190px + env(safe-area-inset-bottom)); }
  }
  #help { font-size: 13px; line-height: 1.8; opacity: .7; margin-top: 10px; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="game" width="960" height="672"></canvas>
<div id="help">方向键/WASD 移动 &middot; 按住SHIFT / 按C 潜行 &middot; 空格 / E 行动 &middot; H 操作说明</div>
<div id="touch">
  <div id="dpad" class="tc"><span class="u"></span><span class="d"></span><span class="l"></span><span class="r"></span></div>
  <div id="bAct" class="tc tb">行动</div>
  <div id="bSneak" class="tc tb">潜行</div>
  <div id="bHelp" class="tc tb">?</div>
</div>
<script>
(() => {
'use strict';
// ====================================================================
//  CONSTANTS
// ====================================================================
let TOUCH = (window.matchMedia && (matchMedia('(pointer: coarse)').matches || matchMedia('(any-pointer: coarse)').matches)) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
if (TOUCH) document.body.classList.add('touch');
let K_ACT = TOUCH ? '行动' : '空格';
const TS = 16, SCALE = 3;
const VW = 20, VH = 14;                // view size in tiles
const BW = VW * TS, BH = VH * TS;      // low-res buffer
const MW = 44, MH = 34;                // map size
const SPAWN = { x: 21, y: 31 };
const DX = [0, -1, 1, 0], DY = [1, 0, 0, -1]; // 0 down,1 left,2 right,3 up

const T = { GRASS:0, PATH:1, STONE:2, WATER:3, FLOWER:4, TREE:5, BUSH:6, BARREL:7, FENCE:8, BLD:9, DOOR:10 };

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const buf = document.createElement('canvas'); buf.width = BW; buf.height = BH;
const g = buf.getContext('2d');
g.imageSmoothingEnabled = false;

// seeded rng for map decoration
let seed = 1337;
const srand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return (h ^ (h >> 16)) >>> 0; };

// ====================================================================
//  AUDIO (tiny beeps)
// ====================================================================
let actx = null;
function beep(freq, dur = 0.08, type = 'square', vol = 0.05, slide = 0) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
    gn.gain.value = vol; gn.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  alert: () => { beep(880, 0.08); setTimeout(() => beep(1320, 0.12), 70); },
  coin: () => { beep(1046, 0.06, 'square', 0.04); setTimeout(() => beep(1568, 0.1, 'square', 0.04), 60); },
  fail: () => beep(220, 0.25, 'sawtooth', 0.05, -120),
  blip: () => beep(660, 0.02, 'square', 0.015),
  caught: () => { beep(300, 0.15, 'sawtooth', 0.06); setTimeout(() => beep(180, 0.3, 'sawtooth', 0.06), 140); },
  select: () => beep(990, 0.05, 'square', 0.03),
};

// ====================================================================
//  MAP
// ====================================================================
const map = new Uint8Array(MW * MH);
const bmap = new Int16Array(MW * MH).fill(-1);
const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? T.TREE : map[y * MW + x];
const set = (x, y, t) => { if (x >= 0 && y >= 0 && x < MW && y < MH) map[y * MW + x] = t; };
const rect = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, t); };

const buildings = [];
function addBuilding(x, y, w, h, doorX, type, name) {
  const b = { x, y, w, h, doorX, doorY: y + h - 1, type, name, id: buildings.length };
  buildings.push(b);
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) { set(xx, yy, T.BLD); bmap[yy * MW + xx] = b.id; }
  set(doorX, y + h - 1, T.DOOR);
  return b;
}

function buildMap() {
  map.fill(T.GRASS);
  // forest borders
  rect(0, 0, 1, MH - 1, T.TREE); rect(MW - 2, 0, MW - 1, MH - 1, T.TREE);
  rect(0, 0, MW - 1, 0, T.TREE); rect(0, MH - 2, MW - 1, MH - 1, T.TREE);
  rect(20, MH - 2, 22, MH - 1, T.PATH);             // town entrance gap
  // east forest edge
  for (let y = 10; y < MH - 2; y++) for (let x = 36; x < MW - 2; x++) {
    const r = srand(), edge = (x - 36) / 6;
    if (r < 0.15 + edge * 0.55) set(x, y, T.TREE); else if (r < 0.32 + edge * 0.4) set(x, y, T.BUSH);
  }
  // west thicket
  for (let y = 11; y < 21; y++) for (let x = 2; x < 4; x++) {
    const r = srand(); if (r < 0.35) set(x, y, T.TREE); else if (r < 0.6) set(x, y, T.BUSH);
  }
  // roads
  rect(20, 12, 22, MH - 1, T.PATH);
  rect(4, 17, 35, 18, T.PATH);
  rect(6, 8, 6, 16, T.PATH);
  rect(34, 7, 34, 16, T.PATH);
  rect(22, 27, 31, 27, T.PATH);
  rect(6, 26, 13, 26, T.PATH); rect(13, 19, 13, 30, T.PATH);
  // plaza
  rect(15, 12, 27, 22, T.STONE);
  rect(20, 14, 22, 15, T.WATER);                    // fountain
  // mansion grounds
  rect(13, 2, 29, 10, T.GRASS);
  for (let y = 7; y <= 10; y++) for (let x = 13; x <= 29; x++) if (srand() < 0.12) set(x, y, T.FLOWER);
  rect(21, 7, 21, 11, T.STONE); rect(15, 8, 27, 8, T.PATH); rect(15, 10, 27, 10, T.PATH);
  rect(15, 8, 15, 10, T.PATH); rect(27, 8, 27, 10, T.PATH);
  rect(12, 1, 30, 1, T.FENCE); rect(12, 1, 12, 11, T.FENCE); rect(30, 1, 30, 11, T.FENCE);
  rect(12, 11, 30, 11, T.FENCE); rect(20, 11, 22, 11, T.STONE);
  [[13, 7], [29, 7], [17, 7], [25, 7], [13, 10], [29, 10], [18, 9], [24, 9]].forEach(([x, y]) => set(x, y, T.BUSH));
  // buildings
  addBuilding(15, 2, 13, 5, 21, 'mansion', '领主府邸');
  addBuilding(3, 2, 7, 6, 6, 'church', '教堂');
  addBuilding(32, 2, 6, 5, 34, 'house', '民居');
  addBuilding(28, 21, 8, 6, 31, 'tavern', '醉鹅酒馆');
  addBuilding(4, 21, 6, 5, 6, 'house', '民居');
  addBuilding(10, 26, 6, 5, 12, 'house', '民居');
  set(12, 31, T.PATH);
  // flowers & scatter
  for (let i = 0; i < 70; i++) {
    const x = 2 + Math.floor(srand() * 34), y = 2 + Math.floor(srand() * 30);
    if (at(x, y) === T.GRASS) set(x, y, T.FLOWER);
  }
  // bushes (hiding spots)
  [[10, 4], [10, 6], [2, 9], [11, 9], [14, 13], [14, 14], [14, 20], [19, 25], [23, 29], [24, 24],
   [8, 19], [11, 15], [16, 26], [26, 30], [31, 10], [27, 15], [3, 27], [8, 30], [31, 30]].forEach(([x, y]) => set(x, y, T.BUSH));
  // barrels
  [[27, 21], [27, 22], [10, 22], [10, 23], [16, 12], [26, 12], [8, 8], [36, 22], [36, 24], [17, 30], [37, 5]].forEach(([x, y]) => set(x, y, T.BARREL));
  set(SPAWN.x, SPAWN.y, T.PATH);
}
buildMap();

const solidP = t => t === T.TREE || t === T.WATER || t === T.FENCE || t === T.BLD || t === T.DOOR;
const solidN = t => solidP(t) || t === T.BARREL;
const opaque = t => t === T.TREE || t === T.BLD || t === T.DOOR;

// ====================================================================
//  PIXEL ART (procedural placeholder sprites)
// ====================================================================
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); fn(x); return c; }
const P = (c, x, y, col, w = 1, h = 1) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

function grassTile(v, flower) {
  return mk(16, 16, c => {
    P(c, 0, 0, '#5c9e3e', 16, 16);
    let s = 99 + v * 31;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < 14; i++) P(c, Math.floor(r() * 16), Math.floor(r() * 16), r() < .5 ? '#6db54b' : '#4c8a33');
    for (let i = 0; i < 2; i++) { const x = Math.floor(r() * 13), y = 2 + Math.floor(r() * 12); P(c, x, y, '#7cc457'); P(c, x + 2, y - 1, '#7cc457'); P(c, x + 1, y + 1, '#4c8a33'); }
    if (flower) {
      const cols = ['#f05a5a', '#f5d742', '#ffffff', '#c78bf0'];
      for (let i = 0; i < 3; i++) { const x = 2 + Math.floor(r() * 11), y = 2 + Math.floor(r() * 11), col = cols[Math.floor(r() * 4)];
        P(c, x, y + 1, '#3d7a2a'); P(c, x - 1, y, col); P(c, x + 1, y, col); P(c, x, y - 1, col); P(c, x, y, '#fff3a0'); }
    }
  });
}
function pathTile(v) {
  return mk(16, 16, c => {
    P(c, 0, 0, '#c9a46a', 16, 16);
    let s = 7 + v * 13; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < 12; i++) P(c, Math.floor(r() * 16), Math.floor(r() * 16), r() < .5 ? '#b58f56' : '#d9b981');
    for (let i = 0; i < 2; i++) { const x = Math.floor(r() * 14), y = Math.floor(r() * 14); P(c, x, y, '#9c7a48', 2, 1); P(c, x, y - 1 < 0 ? 0 : y - 1, '#e2c592', 2, 1); }
  });
}
const stoneTile = mk(16, 16, c => {
  P(c, 0, 0, '#a3a1ac', 16, 16);
  P(c, 0, 0, '#86848f', 16, 1); P(c, 0, 8, '#86848f', 16, 1);
  P(c, 0, 0, '#86848f', 1, 8); P(c, 8, 8, '#86848f', 1, 8);
  P(c, 1, 1, '#b9b7c2', 6, 1); P(c, 9, 9, '#b9b7c2', 6, 1); P(c, 1, 9, '#b9b7c2', 6, 1); P(c, 9, 1, '#b9b7c2', 6, 1);
  P(c, 5, 4, '#94929d'); P(c, 12, 12, '#94929d'); P(c, 3, 13, '#94929d');
});
function waterTile(f) {
  return mk(16, 16, c => {
    P(c, 0, 0, '#3b78c8', 16, 16);
    for (let i = 0; i < 4; i++) { const y = (i * 4 + f * 2) % 16, x = (i * 5 + f * 3) % 12; P(c, x, y, '#79b0f0', 4, 1); P(c, x + 1, y + 1, '#5592de', 3, 1); }
  });
}
const grassT = [0, 1, 2, 3].map(v => grassTile(v, false));
const flowerT = [0, 1, 2].map(v => grassTile(v + 10, true));
const pathT = [0, 1, 2].map(pathTile);
const waterT = [0, 1, 2, 3].map(waterTile);

const treeSpr = mk(16, 32, c => {
  P(c, 3, 29, 'rgba(0,0,0,.25)', 11, 3);
  P(c, 6, 20, '#4a2e17', 5, 11); P(c, 7, 20, '#6b4426', 3, 10); P(c, 7, 21, '#80562f', 1, 8);
  const rows = [[5, 6], [3, 10], [2, 12], [1, 14], [1, 14], [0, 16], [0, 16], [0, 16], [0, 16], [0, 16], [0, 16], [1, 14], [1, 14], [1, 14], [2, 12], [2, 12], [3, 10], [4, 8], [6, 4]];
  rows.forEach(([x, w], i) => P(c, x, 2 + i, '#1f4a1c', w, 1));
  rows.forEach(([x, w], i) => { if (i > 0 && i < rows.length - 2) P(c, x + 1, 2 + i, '#2f6b2a', w - 2, 1); });
  rows.forEach(([x, w], i) => { if (i > 1 && i < 10) P(c, x + 2, 2 + i, '#3f8a35', Math.max(1, w - 7), 1); });
  P(c, 4, 6, '#5aa848', 2, 1); P(c, 3, 7, '#5aa848', 1, 1); P(c, 8, 4, '#5aa848', 2, 1); P(c, 11, 10, '#3f8a35', 2, 2);
  P(c, 2, 17, '#244f20', 12, 1); P(c, 9, 15, '#244f20', 3, 1);
});
const bushSpr = mk(16, 16, c => {
  P(c, 2, 14, 'rgba(0,0,0,.25)', 12, 2);
  const rows = [[5, 6], [3, 10], [2, 12], [1, 14], [1, 14], [0, 16], [0, 16], [0, 16], [1, 14], [1, 14], [2, 12]];
  rows.forEach(([x, w], i) => P(c, x, 3 + i, '#255c22', w, 1));
  rows.forEach(([x, w], i) => { if (i > 0 && i < rows.length - 1) P(c, x + 1, 3 + i, '#3a8a32', w - 2, 1); });
  P(c, 4, 5, '#5ab34a', 3, 1); P(c, 3, 6, '#5ab34a', 2, 1); P(c, 9, 6, '#5ab34a', 2, 1); P(c, 6, 9, '#4aa03e', 2, 1);
  P(c, 11, 8, '#d94848'); P(c, 5, 11, '#d94848'); P(c, 9, 11, '#d94848');
  P(c, 1, 12, '#1d4a1a', 14, 1);
});
function barrelSpr(occupied) {
  return mk(16, 16, c => {
    P(c, 2, 14, 'rgba(0,0,0,.3)', 12, 2);
    P(c, 3, 3, '#3a220e', 10, 12); P(c, 2, 5, '#3a220e', 12, 8);
    P(c, 4, 4, '#8a5a2c', 8, 10); P(c, 3, 6, '#8a5a2c', 10, 6);
    P(c, 5, 4, '#a8743c', 2, 10); P(c, 3, 6, '#9a6634', 1, 6);
    P(c, 3, 6, '#4a4a52', 10, 1); P(c, 3, 11, '#4a4a52', 10, 1);
    P(c, 4, 6, '#7a7a84', 3, 1); P(c, 4, 11, '#7a7a84', 3, 1);
    if (occupied) { // lid ajar, eyes peeking
      P(c, 3, 1, '#3a220e', 10, 3); P(c, 4, 1, '#b07c44', 8, 2);
      P(c, 4, 3, '#140c06', 8, 2); P(c, 6, 3, '#fff', 1, 1); P(c, 9, 3, '#fff', 1, 1);
    } else { P(c, 4, 3, '#b07c44', 8, 2); P(c, 5, 3, '#c89458', 4, 1); }
  });
}
const barrelS = barrelSpr(false), barrelO = barrelSpr(true);
function fenceSpr(l, r, u, d) {
  return mk(16, 20, c => {
    const wood = '#a07848', dark = '#5e4226', lite = '#c49a64';
    if (l) { P(c, 0, 8, dark, 8, 4); P(c, 0, 8, lite, 8, 1); P(c, 0, 9, wood, 8, 2); }
    if (r) { P(c, 8, 8, dark, 8, 4); P(c, 8, 8, lite, 8, 1); P(c, 8, 9, wood, 8, 2); }
    if (u) { P(c, 7, 0, dark, 3, 10); P(c, 7, 0, wood, 2, 10); }
    if (d) { P(c, 7, 10, dark, 3, 10); P(c, 7, 10, wood, 2, 10); }
    P(c, 6, 4, dark, 5, 14); P(c, 7, 4, wood, 3, 13); P(c, 7, 4, lite, 1, 12); P(c, 6, 3, lite, 5, 1);
    P(c, 5, 17, 'rgba(0,0,0,.25)', 7, 2);
  });
}
const fenceCache = {};
function getFence(x, y) {
  const f = (a, b) => at(a, b) === T.FENCE;
  const k = '' + +f(x - 1, y) + +f(x + 1, y) + +f(x, y - 1) + +f(x, y + 1);
  return fenceCache[k] || (fenceCache[k] = fenceSpr(f(x - 1, y), f(x + 1, y), f(x, y - 1), f(x, y + 1)));
}

// Buildings: roof + front wall, drawn as one sprite for a 2.5D look
const BSTYLE = {
  mansion: { roof: '#4a3f8a', roofD: '#2f2760', roofL: '#6a5fb0', wall: '#e4dac4', wallD: '#b8aa8c', trim: '#e0b840', door: '#5a2e1a' },
  church:  { roof: '#5a6a80', roofD: '#3a4658', roofL: '#7c8ca4', wall: '#d8d4ca', wallD: '#a8a296', trim: '#c8c0b0', door: '#6a4020' },
  tavern:  { roof: '#9a3a28', roofD: '#682418', roofL: '#c05a40', wall: '#d2a874', wallD: '#8a6438', trim: '#5a3a1c', door: '#4a2a14' },
  house:   { roof: '#c0602c', roofD: '#843e1a', roofL: '#e08248', wall: '#eadcbc', wallD: '#b0a080', trim: '#7a5430', door: '#6a4020' },
};
function buildingSpr(b) {
  const s = BSTYLE[b.type], W = b.w * TS, H = b.h * TS + 8;
  return mk(W, H, c => {
    const wallH = 24, roofH = H - wallH;
    // wall
    P(c, 0, roofH, s.wallD, W, wallH); P(c, 1, roofH, s.wall, W - 2, wallH - 2);
    P(c, 1, H - 3, s.wallD, W - 2, 1);
    if (b.type === 'tavern' || b.type === 'house') for (let x = 0; x < W; x += 16) P(c, x, roofH, s.trim, 2, wallH);
    if (b.type === 'mansion') for (let x = 8; x < W; x += 32) { P(c, x, roofH, '#fff8e8', 4, wallH - 2); P(c, x + 3, roofH, s.wallD, 1, wallH - 2); }
    // windows
    for (let tx = 0; tx < b.w; tx++) {
      const wx = b.x + tx; if (Math.abs(wx - b.doorX) < 1 || (tx % 2 === 0 && b.w > 2 && tx !== 0 && tx !== b.w - 1) || tx === 0 || tx === b.w - 1) continue;
      const x = tx * 16 + 4, y = roofH + 6;

let holdT = 0, lastHeld = -1;
function updatePlayer(dt) {

  if (player.moving) {
    player.mt += dt / player.moveDur;
    if (player.mt >= 1) { player.moving = false; player.mt = 0; }
    const t = player.moving ? player.mt : 1;
    player.px = (player.fx + (player.x - player.fx) * t) * TS; player.py = (player.fy + (player.y - player.fy) * t) * TS;
    if (player.moving) return;
  }
  const held = dirStack.length ? DIRNAME[dirStack[dirStack.length - 1]] : -1;
  if (held < 0) { holdT = 0; lastHeld = -1; return; }
  if (held !== lastHeld) { lastHeld = held; holdT = 0; }
  holdT += dt;
  if (player.dir !== held) { player.dir = held; holdT = 0; return; }
  if (holdT < 0.07 && !player.wasMoving) return;
  const nx = player.x + DX[held], ny = player.y + DY[held];
  if (solidP(at(nx, ny)) || occupied(nx, ny, player)) { player.wasMoving = false; return; }
  player.fx = player.x; player.fy = player.y; player.x = nx; player.y = ny;
  player.moving = true; player.mt = 0;
  player.moveDur = player.crouch ? 0.3 : (at(nx, ny) === T.BUSH || at(nx, ny) === T.BARREL ? 0.22 : 0.15);

}
function lateWasMoving() { if (!dirStack.length) player.wasMoving = false; }

function playerAction() {

  const f = facingNPC();
  if (f && (f.type === 'villager' || f.friendly)) { talkTo(f); return; }
  const tx = player.x + DX[player.dir], ty = player.y + DY[player.dir];
  if (at(tx, ty) === T.DOOR) { interactDoor(buildings[bmap[ty * MW + tx]]); return; }
  if (at(player.x, player.y) === T.BARREL) { say('', '又挤又黑，还有股腌鲱鱼味。完美。'); return; }
}

// ====================================================================
//  UPDATE
// ====================================================================
function update(dt) {
  time += dt;
  if (pressed.help) { showHelp = !showHelp; }
  if (pressed.ctoggle) crouchToggle = !crouchToggle;

  if (mode === 'fade') {
    fade.t += dt;
    if (fade.phase === 0 && fade.t > 0.6) { fade.phase = 1; fade.onMid && fade.onMid(); }
    if (fade.t > 1.2) { mode = 'play'; if (dlg.queue.length) nextDialogue(); }
    return;
  }
  if (mode === 'dialogue') {
    const c = dlg.cur;
    if (c && dlg.shown < c.text.length) { const before = Math.floor(dlg.shown); dlg.shown = Math.min(c.text.length, dlg.shown + dt * 26); if (Math.floor(dlg.shown) !== before && Math.floor(dlg.shown) % 2 === 0) sfx.blip(); }
    if (c && c.choices && dlg.shown >= c.text.length) {
      if (pressed.up) { dlg.choice = (dlg.choice + c.choices.length - 1) % c.choices.length; sfx.blip(); }
      if (pressed.down) { dlg.choice = (dlg.choice + 1) % c.choices.length; sfx.blip(); }
    }
    if (pressed.act) dialogueAction();
    return;
  }
  if (mode === 'minigame') {
    if (mg.result) { mg.rt -= dt; if (mg.rt <= 0) endMinigame(); return; }
    mg.pos += mg.dir * mg.speed * dt;
    if (mg.pos >= 1) { mg.pos = 1; mg.dir = -1; mg.sweeps++; }
    if (mg.pos <= 0) { mg.pos = 0; mg.dir = 1; mg.sweeps++; }
    if (pressed.act) resolvePickpocket(mg.pos >= mg.zone && mg.pos <= mg.zone + mg.zoneW);
    else if (mg.sweeps >= 3) resolvePickpocket(false);
    return;
  }

  // ---- play ----
  if (grace > 0) grace -= dt;
  updatePlayer(dt);
  if (pressed.act && !player.moving) playerAction();
  lateWasMoving();
  for (const n of npcs) stepNPC(n, dt);
  for (let i = npcs.length - 1; i >= 0; i--) if (npcs[i].dead) npcs.splice(i, 1);

  // hidden justice: hoarding slowly sours the town
  hoardTimer -= dt;
  if (hoardTimer <= 0) {
    hoardTimer = 20;
    if (gold > 120) justice = clamp(justice - (1 + Math.floor((gold - 120) / 120)), -100, 100);
    else if (gold < 40 && justice < 0) justice = Math.min(0, justice + 1); // the poor are forgiven
  }
  popTimer -= dt;
  if (popTimer <= 0) { popTimer = 20; populationTick(); }
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = 3.5;
    const count = npcs.filter(n => n.type === 'adventurer' && n.state !== 'leave').length;
    const far = Math.abs(player.x - SPAWN.x) + Math.abs(player.y - (MH - 2)) > 4;
    if (count < targetAdventurers() && far && !occupied(SPAWN.x, MH - 2, null)) spawnAdventurer(SPAWN.x, MH - 2);
  }
  for (const f of floaters) f.t += dt;
  for (let i = floaters.length - 1; i >= 0; i--) if (floaters[i].t > 1.2) floaters.splice(i, 1);
}

// ====================================================================
//  RENDER
// ====================================================================
function render() {
  // camera
  camX = Math.round(clamp(player.px + 8 - BW / 2, 0, MW * TS - BW));
  camY = Math.round(clamp(player.py + 8 - BH / 2, 0, MH * TS - BH));
  const tx0 = Math.floor(camX / TS), ty0 = Math.floor(camY / TS);
  g.fillStyle = '#1a3a18'; g.fillRect(0, 0, BW, BH);
  const wf = Math.floor(time * 3) % 4;
  // ground layer
  for (let ty = ty0 - 1; ty <= ty0 + VH + 1; ty++) for (let tx = tx0 - 1; tx <= tx0 + VW + 1; tx++) {
    if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) continue;
    const t = map[ty * MW + tx], sx = tx * TS - camX, sy = ty * TS - camY, h = hash(tx, ty);
    let img;
    if (t === T.PATH) img = pathT[h % 3];
    else if (t === T.STONE) img = stoneTile;
    else if (t === T.WATER) img = waterT[(wf + h) % 4];
    else if (t === T.FLOWER) img = flowerT[h % 3];
    else img = grassT[h % 4];
    g.drawImage(img, sx, sy);
    if (t === T.WATER) { // fountain rim
      if (at(tx, ty - 1) !== T.WATER) { P(g, sx, sy, '#c8c4d0', 16, 3); P(g, sx, sy + 3, '#8a8694', 16, 1); }
      if (at(tx, ty + 1) !== T.WATER) { P(g, sx, sy + 12, '#8a8694', 16, 4); P(g, sx, sy + 12, '#c8c4d0', 16, 1); }
      if (at(tx - 1, ty) !== T.WATER) P(g, sx, sy, '#b0acb8', 2, 16);
      if (at(tx + 1, ty) !== T.WATER) P(g, sx + 14, sy, '#b0acb8', 2, 16);
    }
  }
  // fountain spout
  { const sx = 21 * TS - camX + 6, sy = 14 * TS - camY + 4; P(g, sx, sy, '#c8c4d0', 4, 10); P(g, sx + 1, sy - 3 + (Math.floor(time * 6) % 2), '#a8d8ff', 2, 4); }

  // vision cones
  for (const n of npcs) {
    if (!n.cone || !n.cone.length || n.friendly) continue;
    const ox = n.px - n.x * TS, oy = n.py - n.y * TS;
    const chasing = n.state === 'chase' || n.state === 'alert';
    const searching = n.state === 'search';
    for (const c of n.cone) {
      const eff = n.range - (player.crouch ? 1 : 0);
      const a = (c.d > eff ? 0.14 : 0.36) + 0.06 * Math.sin(time * 5 + c.d);
      g.fillStyle = chasing ? `rgba(255,60,40,${a + 0.08})` : searching ? `rgba(255,160,40,${a})` : `rgba(255,240,120,${a})`;
      const cx = Math.round(c.x * TS - camX + ox), cy = Math.round(c.y * TS - camY + oy);
      g.fillRect(cx, cy, TS, TS);
      g.fillStyle = chasing ? 'rgba(255,60,40,.35)' : 'rgba(255,250,200,.3)';
      g.fillRect(cx + 1, cy + 1, TS - 2, 1); g.fillRect(cx + 1, cy + 1, 1, TS - 2);
    }
  }

  // y-sorted objects
  const list = [];
  const pOnBarrel = at(player.x, player.y) === T.BARREL && !player.moving;
  for (let ty = ty0 - 1; ty <= ty0 + VH + 3; ty++) for (let tx = tx0 - 1; tx <= tx0 + VW + 1; tx++) {
    if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) continue;
    const t = map[ty * MW + tx];
    if (t === T.TREE) list.push({ k: (ty + 1) * TS, f: () => g.drawImage(treeSpr, tx * TS - camX, ty * TS - 16 - camY) });
    else if (t === T.BUSH) list.push({ k: (ty + 1) * TS + 0.5, f: () => {
      const sway = (player.x === tx && player.y === ty) ? Math.round(Math.sin(time * 20)) : 0;
      g.drawImage(bushSpr, tx * TS - camX + sway, ty * TS - camY);
    } });
    else if (t === T.BARREL) list.push({ k: (ty + 1) * TS + 0.5, f: () => g.drawImage(pOnBarrel && player.x === tx && player.y === ty ? barrelO : barrelS, tx * TS - camX, ty * TS - camY) });
    else if (t === T.FENCE) list.push({ k: (ty + 1) * TS - 1, f: () => g.drawImage(getFence(tx, ty), tx * TS - camX, ty * TS - 4 - camY) });
  }
  for (const b of buildings) {
    if ((b.x + b.w) * TS < camX || b.x * TS > camX + BW || (b.y + b.h) * TS < camY - 8 || b.y * TS - 8 > camY + BH) continue;
    list.push({ k: (b.y + b.h) * TS, f: () => g.drawImage(bldSpr[b.id], b.x * TS - camX, b.y * TS - 8 - camY) });
  }
  for (const n of npcs) list.push({ k: n.py + TS + 0.2, f: () => drawChar(g, n, n.px - camX, n.py - camY) });
  if (!pOnBarrel) list.push({ k: player.py + TS + 0.3, f: () => {
    if (isHidden()) g.globalAlpha = 0.55;
    drawChar(g, player, player.px - camX, player.py - camY);
    g.globalAlpha = 1;
  } });
  list.sort((a, b) => a.k - b.k);
  for (const o of list) o.f();

  // overhead icons
  for (const n of npcs) {
    const x = Math.round(n.px - camX), y = Math.round(n.py - camY);
    if (n.icon && n.iconT > 0) {
      const bounce = n.icon === '!' ? Math.round(Math.abs(Math.sin(n.iconT * 10)) * -3) : 0;
      const bx = x + 4, by = y - 14 + bounce;
      P(g, bx - 1, by - 1, '#1a1420', 10, 12); P(g, bx, by, n.icon === '!' ? '#ffe040' : '#e0e8ff', 8, 10);
      if (n.icon === '!') { P(g, bx + 3, by + 1, '#c02020', 2, 5); P(g, bx + 3, by + 7, '#c02020', 2, 2); }
      else { P(g, bx + 2, by + 1, '#3050c0', 4, 1); P(g, bx + 5, by + 2, '#3050c0', 1, 2); P(g, bx + 3, by + 4, '#3050c0', 2, 1); P(g, bx + 3, by + 5, '#3050c0', 1, 1); P(g, bx + 3, by + 7, '#3050c0', 1, 1); }
    }
    if (n.friendly && !n.icon && Math.floor(time * 2 + n.x) % 4 === 0) { P(g, x + 7, y - 8, '#60e080', 2, 2); P(g, x + 6, y - 9, '#60e080', 1, 1); P(g, x + 9, y - 9, '#60e080', 1, 1); }
  }
  // pickpocket / interact prompt
  if (mode === 'play' && !player.moving) {
    const t = behindTarget();
    if (t) { const x = Math.round(t.px - camX) + 4, y = Math.round(t.py - camY) - 12 + Math.round(Math.sin(time * 6));
      P(g, x - 1, y - 1, '#1a1420', 10, 9); P(g, x, y, '#ffe060', 8, 7); P(g, x + 2, y + 1, '#8a6a10', 4, 5); P(g, x + 3, y + 2, '#ffe060', 2, 1); }
  }
  // floaters
  g.font = '8px monospace'; g.textAlign = 'center';
  for (const f of floaters) { g.fillStyle = '#000'; g.fillText(f.text, f.x - camX + 1, f.y - camY - f.t * 18 + 1); g.fillStyle = f.col; g.fillText(f.text, f.x - camX, f.y - camY - f.t * 18); }

  // gentle warm vignette for that handheld look
  const vg = g.createRadialGradient(BW / 2, BH / 2, BH * 0.35, BW / 2, BH / 2, BH * 0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(20,10,30,0.35)');
  g.fillStyle = vg; g.fillRect(0, 0, BW, BH);

  // scale up (nearest neighbour)
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, BW * SCALE, BH * SCALE);
  drawUI();
}

// ---------- UI (full-res, pixel font) ----------
const FONT = '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
const PIXFONT = '"Press Start 2P", monospace';
function panel(x, y, w, h) {
  ctx.fillStyle = '#0c0a18'; ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  ctx.fillStyle = '#e8e4f8'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#1e2a6a'; ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
  ctx.fillStyle = '#2a3a8a'; ctx.fillRect(x + 4, y + 4, w - 8, 3);
}
function text(s, x, y, size = 16, col = '#fff', align = 'left', font = FONT) {
  ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 3, y + 3);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const out = [], noStart = '，。！？、；：）」』”……—';
  for (const para of s.split('\n')) {
    let line = '';
    for (const ch of para) {
      const t = line + ch;
      if (ctx.measureText(t).width > maxW && line && !noStart.includes(ch)) { out.push(line); line = ch === ' ' ? '' : ch; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function drawUI() {
  // gold
  panel(14, 14, 180, 46);
  const cx = 34, cy = 26;
  ctx.fillStyle = '#8a6a10'; ctx.fillRect(cx - 2, cy, 26, 24); ctx.fillStyle = '#ffd840'; ctx.fillRect(cx, cy + 2, 22, 20);
  ctx.fillStyle = '#fff4a0'; ctx.fillRect(cx + 3, cy + 5, 4, 8); ctx.fillStyle = '#c89a20'; ctx.fillRect(cx + 9, cy + 6, 4, 12);
  text(String(gold), 68, 28, 18, '#ffe060', 'left', PIXFONT);
  // bag
  if (bag.length) {
    const names = bag.map(i => i.name);
    const lines = [];
    for (let i = 0; i < names.length; i += 1) lines.push(names[i]);
    const h = 18 + lines.length * 20;
    panel(14, 70, 230, h);
    lines.forEach((l, i) => text('· ' + l, 26, 79 + i * 20, 13, bag[i].key ? '#ffe060' : '#d8e0ff'));
  }
  // stance
  const hid = isHidden();
  const st = hid ? '隐藏中' : player.crouch ? '潜行中' : '';
  if (st) { panel(960 - 14 - 150, 14, 150, 40); text(st, 960 - 14 - 75, 24, 16, hid ? '#80f0a0' : '#c8d0ff', 'center'); }
  // chase warning
  if (mode === 'play' && npcs.some(n => n.state === 'chase')) { const a = 0.6 + 0.4 * Math.sin(time * 10); text('快跑！', 480, 22, 24, `rgba(255,80,60,${a})`, 'center'); }

  // contextual prompt
  if (mode === 'play' && !player.moving) {
    let p = '';
    if (behindTarget()) p = K_ACT + '：扒窃';
    else { const f = facingNPC(); const tx = player.x + DX[player.dir], ty = player.y + DY[player.dir];
      if (f && (f.type === 'villager' || f.friendly)) p = K_ACT + '：交谈';
      else if (at(tx, ty) === T.DOOR) p = K_ACT + '：' + buildings[bmap[ty * MW + tx]].name; }
    if (p) { ctx.font = `16px ${FONT}`; const w = ctx.measureText(p).width + 36; panel(480 - w / 2, 606, w, 44); text(p, 480, 619, 16, '#fff', 'center'); }
  }

  if (showHelp) {
    panel(200, 120, 560, 300);
    const L = ['操作说明', ''].concat(TOUCH ? ['方向键：移动（轻点转向）', '潜行键：开 / 关潜行', '行动键：扒窃 / 交谈 / 进入', '右上角 ?：打开 / 关闭本面板'] : ['方向键 / WASD：移动（轻点转向）', '按住 Shift / 按 C：潜行', '空格 / E：行动 / 交谈 / 进入', 'H：打开 / 关闭本面板'], ['',
      '站在目标正后方、面朝其背后，', '即可扒窃。', '在草丛中潜行，或钻进木桶，', '就能从视线中消失。']);
    L.forEach((l, i) => text(l, 230, 140 + i * 25, i === 0 ? 18 : 15, i === 0 ? '#ffe060' : '#e8e8ff'));
  }

  // minigame
  if (mode === 'minigame') {
    const x = 230, y = 470, w = 500, h = 90;
    panel(x, y, w, h);
    text(`正在摸${mg.target.name}的钱袋……`, x + 20, y + 12, 15, '#e8e8ff');
    const bx = x + 20, by = y + 44, bw = w - 40, bh = 24;
    ctx.fillStyle = '#0c0a18'; ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
    ctx.fillStyle = '#5a2030'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#40c060'; ctx.fillRect(bx + mg.zone * bw, by, mg.zoneW * bw, bh);
    ctx.fillStyle = '#90f0a0'; ctx.fillRect(bx + (mg.zone + mg.zoneW * 0.4) * bw, by, mg.zoneW * 0.2 * bw, bh);
    const cxp = bx + mg.pos * bw;
    ctx.fillStyle = '#fff'; ctx.fillRect(cxp - 3, by - 8, 6, bh + 16); ctx.fillStyle = '#000'; ctx.fillRect(cxp - 1, by - 6, 2, bh + 12);
    if (mg.result) { panel(x + 60, y - 56, w - 120, 44); text(mg.msg, x + w / 2, y - 44, 15, mg.result === 'ok' ? '#ffe060' : '#ff7060', 'center'); }
    else text('按' + K_ACT + '！', x + w - 20, y + 12, 15, '#ffe060', 'right');
  }

  // dialogue
  if (mode === 'dialogue' && dlg.cur) {
    const c = dlg.cur, x = 24, y = 672 - 168, w = 912, h = 150;
    panel(x, y, w, h);
    if (c.name) { ctx.font = `16px ${FONT}`; const nw = ctx.measureText(c.name).width + 32; panel(x + 16, y - 38, nw, 38); text(c.name, x + 32, y - 26, 16, '#ffe060'); }
    const lines = wrap(c.text.slice(0, Math.floor(dlg.shown)), w - 56, 20);
    lines.slice(0, 4).forEach((l, i) => text(l, x + 28, y + 22 + i * 30, 20, '#fff'));
    const done = dlg.shown >= c.text.length;
    if (done && c.choices) {
      ctx.font = `16px ${FONT}`;
      const cw = Math.max(...c.choices.map(o => ctx.measureText(o.label).width)) + 70, ch = c.choices.length * 30 + 24;
      const cxx = x + w - cw - 8, cyy = y - ch - 10;
      panel(cxx, cyy, cw, ch);
      c.choices.forEach((o, i) => {
        const sel = i === dlg.choice;
        text((sel ? '▶ ' : '   ') + o.label, cxx + 18, cyy + 14 + i * 30, 16, sel ? '#ffe060' : '#c8d0ff');
      });
    } else if (done && Math.floor(time * 3) % 2) {
      ctx.fillStyle = '#ffe060'; ctx.beginPath(); ctx.moveTo(x + w - 40, y + h - 32); ctx.lineTo(x + w - 24, y + h - 32); ctx.lineTo(x + w - 32, y + h - 22); ctx.fill();
    }
  }
  // fade
  if (mode === 'fade') { const a = fade.t < 0.6 ? fade.t / 0.6 : Math.max(0, 1 - (fade.t - 0.6) / 0.6); ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, 960, 672); }
}

// ====================================================================
//  LOOP
// ====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  for (const k in pressed) pressed[k] = false;
  render();
  requestAnimationFrame(frame);
}

initNPCs();
for (const n of npcs) n.cone = n.range ? coneTiles(n) : [];
say('', '你来到磨溪镇，梦想成为一名英雄。');
say('', '结果你输给了一只史莱姆。然后输给了一只鹅。然后又输给了同一只史莱姆。');
say('', '你不是耍剑的料。但这双手……这双手倒是挺灵巧。');
say('', TOUCH ? '别走进黄色的视野范围。悄悄绕到别人【身后】，按行动键偷走钱袋。按潜行键开关潜行；在草丛里潜行或钻进木桶就能藏身。点右上角 ? 查看操作说明。' : '别走进黄色的视野范围。悄悄绕到别人【身后】，按空格偷走钱袋。按住 SHIFT 潜行；在草丛里潜行或钻进木桶就能藏身。按 H 查看操作说明。');
grace = 1;
const start = () => requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(start); else start();

// test hook (read-only snapshot; deliberately omits hidden values)
window.__game = { get player() { return { x: player.x, y: player.y, dir: player.dir }; }, get mode() { return mode; }, get gold() { return gold; }, get npcs() { return npcs.map(n => ({ type: n.type, x: n.x, y: n.y, state: n.state })); } };
})();
</script>
